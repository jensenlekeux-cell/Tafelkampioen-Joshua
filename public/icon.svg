<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350F" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Inner decorative ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#FDE68A" stroke-width="8" stroke-dasharray="16 12" opacity="0.4" />

  <!-- Big Multiplication Cross in White & Gold -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Multiplication X -->
    <path d="M-80 -80 L80 80 M80 -80 L-80 80" stroke="#FFFFFF" stroke-width="54" stroke-linecap="round" />
    <path d="M-80 -80 L80 80 M80 -80 L-80 80" stroke="url(#gold)" stroke-width="32" stroke-linecap="round" />
  </g>

  <!-- Playful stars -->
  <g fill="#FEF3C7" opacity="0.9">
    <!-- Top left star -->
    <path d="M120 120 L126 136 L142 142 L126 148 L120 164 L114 148 L98 142 L114 136 Z" />
    <!-- Bottom right star -->
    <path d="M390 370 L396 384 L410 390 L396 396 L390 410 L384 396 L370 390 L384 384 Z" />
    <!-- Top right star -->
    <path d="M380 130 L385 142 L397 147 L385 152 L380 164 L375 152 L363 147 L375 142 Z" />
  </g>

  <!-- Little crown at top of X -->
  <path d="M226 150 L240 170 L256 142 L272 170 L286 150 L280 185 L232 185 Z" fill="#FFFFFF" opacity="0.95" />
</svg>
